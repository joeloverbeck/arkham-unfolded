[package]
name = "arkham-unfolded-experiment"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
publish = false

[workspace]
members = ["tools"]
resolver = "3"

[features]
default = []
# The table package comes only with the table. Its `seat` feature implies its `render`
# and brings what the held session needs to start its own session and to wait for
# requests until its idle end.
tabletop = ["dep:bevy", "unfolded-tabletop/seat"]

[dependencies]
# Shared packages, all at one revision of one repository, the same as the `wgpu-hal`
# patch below and `tools`' pins. The library, driver and asset build take only the
# packages that cannot depend on Bevy; `unfolded-tabletop` holds what draws.
unfolded-assets = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0510364f82874159eeca9db4325eb176f0a1252c" }
unfolded-random = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0510364f82874159eeca9db4325eb176f0a1252c" }
unfolded-record-replacement = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0510364f82874159eeca9db4325eb176f0a1252c" }
unfolded-tabletop = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0510364f82874159eeca9db4325eb176f0a1252c", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
lzma-rs = "0.3"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
toml = "1.1"
rustix = { version = "1", features = ["fs"] }
zip = { version = "=9.4.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
bevy = { version = "=0.20.0", optional = true, default-features = false, features = [
  "std", "async_executor", "multi_threaded", "bevy_asset", "bevy_log",
  "bevy_winit", "3d_bevy_render", "ui_bevy_render", "bevy_ui_widgets",
  "bevy_picking", "mesh_picking", "ui_picking", "default_font", "x11", "png", "jpeg",
] }

[[bin]]
name = "arkham-assets"
path = "src/bin/assets.rs"

[dev-dependencies]
arkham-tools = { path = "tools" }
# Inspect the assigned font's character map in headless UI checks.
swash = "=0.2.10"

[[bin]]
name = "arkham-tabletop"
path = "src/bin/tabletop.rs"
required-features = ["tabletop"]

[[bin]]
name = "arkham-driver"
path = "src/bin/driver.rs"

[[example]]
name = "layout_capacity"
required-features = ["tabletop"]
test = false

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Opt in when inspecting variables or stepping through dependencies in a debugger.
[profile.debug-full]
inherits = "dev"
debug = "full"

[profile.debug-full.package."*"]
debug = "full"

[patch.crates-io]
wgpu-hal = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0510364f82874159eeca9db4325eb176f0a1252c" }
