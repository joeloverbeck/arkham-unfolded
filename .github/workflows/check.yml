name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Formatting
        run: scripts/check-format
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ pkg-config libx11-dev libxkbcommon-x11-0 dbus
      - name: Install pinned Rust toolchain
        run: scripts/prepare-ci-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The action keys the compiler, CARGO*, CC*, CFLAGS*, CXX*, CMAKE* and RUST* variables,
          # manifests, lockfile, Cargo config and toolchain file. No custom `key`: it would join
          # the restore prefix, so any edit to its inputs would restore nothing and rebuild every
          # phase. A launcher change that needs new dependency builds repeats them on each run
          # until any keyed input changes and a fresh cache is saved.
          cache-bin: false
      - name: Tracked-file hygiene
        run: scripts/check-index
      - name: Rust tool tests
        run: scripts/check-tools
      - name: Bevy-free library and headless executables
        run: scripts/check-bevy-free
      - name: Clippy
        run: scripts/check-clippy
      - name: Application tests
        run: scripts/check-app
      - name: Renderer upload policy tests
        run: scripts/check-renderer
