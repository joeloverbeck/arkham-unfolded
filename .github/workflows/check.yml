name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Rust checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Ubuntu build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y g++ pkg-config libx11-dev libxkbcommon-x11-0 dbus
      - name: Install pinned Rust toolchain
        run: scripts/prepare-ci-toolchain
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # Rust inputs are keyed automatically; include our check/build settings too.
          key: ${{ hashFiles('.github/workflows/check.yml', 'scripts/check*', 'scripts/tools', 'scripts/prepare-ci-toolchain') }}
          cache-bin: false
      - name: Tracked-file hygiene
        run: scripts/check-index
      - name: Rust tool tests
        run: scripts/check-tools
      - name: Formatting
        run: scripts/check-format
      - name: Clippy
        run: scripts/check-clippy
      - name: Application tests
        run: scripts/check-app
      - name: Renderer upload policy tests
        run: scripts/check-renderer
