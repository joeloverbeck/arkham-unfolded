[package]
name = "arkham-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
default-run = "arkham-tools"

[dependencies]
unfolded-dev-tools = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "6891bbe683dd2670200b47a76a62f964c4a569e2" }
unfolded-tabletop = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "0d9a2264f3fd670132e9886417e27a621e62929b" }
anyhow = "1"
async-io = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
futures-lite = "2"
libc = "0.2"
png = "0.18"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1.1"
x11rb = "0.13"
zbus = "5"
