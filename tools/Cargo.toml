[package]
name = "arkham-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
default-run = "arkham-tools"

[dependencies]
unfolded-dev-tools = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "ded0a5de84e58452382dced97c6cff66dc8e06c9" }
unfolded-seat-client = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "ded0a5de84e58452382dced97c6cff66dc8e06c9" }
unfolded-seat-protocol = { git = "https://github.com/joeloverbeck/unfolded-tabletop", rev = "ded0a5de84e58452382dced97c6cff66dc8e06c9" }
anyhow = "1"
async-io = "2"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
futures-lite = "2"
libc = "0.2"
png = "0.18"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "1.1"
x11rb = "0.13"
zbus = "5"
